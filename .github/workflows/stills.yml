name: stills
on:
  push:
    paths:
      - ".github/trigger/stills.txt"
      - "src/compositions/longform/**"
  workflow_dispatch:

jobs:
  stills:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: ستيلات بدقة كاملة
        shell: bash
        run: |
          set +e
          mkdir -p reports/stills
          for f in 200 700 1000 1300 2900 4400 5500 7300 8100; do
            npx remotion still Longform "reports/stills/f${f}.png" \
              --frame=$f --scale=1 --gl=swiftshader --log=error > _s.log 2>&1
            echo "frame $f exit=$?" >> _s.log
          done
          cp _s.log reports/stills/render_still.log
          ls -l reports/stills | head -20 >> _s.log
      - name: commit
        run: |
          git config user.name "riwaq-bot"
          git config user.email "bot@riwaq.local"
          git add -A reports/stills
          git commit -m "ci: stills 1080p للمراجعة" || echo "no change"
          git push
