name: ref-analyze

on:
  workflow_dispatch:
    inputs:
      file_id:
        description: Google Drive file id
        required: false
        default: "1S7f90pW6yWrHIoh28HVFmxcQoGT33Iia"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg + python deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install --quiet gdown pillow numpy

      - name: Download reference video from Drive
        run: |
          mkdir -p _tmp/ref/out
          gdown "https://drive.google.com/uc?id=${{ inputs.file_id }}" -O _tmp/ref/ref.mp4
          ls -l _tmp/ref/ref.mp4

      - name: Analyze
        env:
          ASR: "1"
        run: python .github/scripts/ref_analyze.py _tmp/ref/ref.mp4 _tmp/ref/out

      - name: Commit results
        run: |
          git config user.name "ref-bot"
          git config user.email "ref-bot@users.noreply.github.com"
          git add -f _tmp/ref/out
          git commit -m "ref: analysis outputs" || echo "nothing to commit"
          git push
