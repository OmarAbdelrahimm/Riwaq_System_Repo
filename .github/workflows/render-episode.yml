name: render-episode

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "معرّف المشروع (مثال GOLDEN_001)"
        required: true
        default: "TMB_001"
      draft:
      scale:
        description: "مقياس الريندر (0.25–1.0)"
        required: false
        default: "0.5"
  push:
    paths:
      - "data/projects/**"
      - "src/**"
      - ".github/trigger/render.txt"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PROJECT_ID: ${{ inputs.project_id || 'TMB_001' }}
      SCALE: ${{ inputs.scale || '0.5' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: تثبيت الحزم
        run: npm ci || npm install

      - name: بناء props من بيانات الحلقة
        run: python3 scripts/make_props.py "data/projects/$PROJECT_ID"

      - name: فحص الأنواع
        continue-on-error: true
        run: npx tsc --noEmit 2>&1 | tee -a ci_log.txt

      - name: ريندر
        id: render
        run: |
          set +e
          mkdir -p exports
          npx remotion render src/index.ts Episode \
            "exports/RIWAQ_${PROJECT_ID}.mp4" \
            --props="data/projects/$PROJECT_ID/render_props.json" \
            --concurrency=1 --crf=20 --scale="$SCALE" --gl=swiftshader \
            > ci_log.txt 2>&1
          RC=$?
          echo "remotion_exit=$RC"
          tail -n 60 ci_log.txt || true
          {
            echo "remotion_exit=$RC"
            echo "--- exports ---"
            ls -la exports 2>&1
            echo "--- node/npm ---"
            node -v; npm -v
            echo "--- remotion version ---"
            npx remotion versions 2>&1 | head -20
          } > ci_diag.txt
          exit 0

      - name: حفظ سجل البناء
        if: always()
        run: |
          { cat ci_diag.txt 2>/dev/null; echo "=== log tail ==="; tail -c 8000 ci_log.txt 2>/dev/null; } > ci_failure.txt

      - name: بوابة الجودة + الكابشنز
        continue-on-error: true
        run: |
          python3 scripts/qc.py "data/projects/$PROJECT_ID/episode_meta.json" exports reports || true
          python3 scripts/make_srt.py "data/projects/$PROJECT_ID/episode_meta.json" outputs || true

      - name: رفع النتائج
        uses: actions/upload-artifact@v4
        with:
          name: riwaq-${{ env.PROJECT_ID }}
          path: |
            exports/*.mp4
            outputs/*.srt
            reports/*.md
            ci_failure.txt
          retention-days: 14
